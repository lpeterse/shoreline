[package]
name = "shoreline"
version = "0.1.0"
description = "A friend-to-friend networking application."
authors = ["Lars Petersen <info@lars-petersen.net>"]
homepage = "https://github.com/lpeterse/shoreline"
repository = "https://github.com/lpeterse/shoreline"
edition = "2024"
license = "MIT"

[dependencies]
bencode-minimal = { version = "0.1" }
eframe = { version = "0.34.1", features = ["default"] }
egui = { version = "0.34.1" }
egui_extras = { version = "0.34.1" }
egui_logger = { version = "0.10.0" }
human_bytes = { version = "0.4.3" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = { version = "0.4.29" }
maxminddb = { version = "0.27.3", features = ["mmap"] }
rand = { version = "0.10.1", features = ["std", "sys_rng"] }
serde = { version = "1.0", features = ["derive"] }
shoreline-dht = { path = "./shoreline-dht" }
shoreline-multipath = { path = "./shoreline-multipath" }
socket2 = { version = "0.6.3", features = ["all"] }
tokio = { version = "1.52.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
toml = { version = "0.9", features = ["preserve_order"] }
ed25519-dalek = { version = "3.0.0-pre.6", features = ["rand_core", "serde", "pkcs8", "pem"] }
pem-rfc7468 = { version = "1.0.0-rc.3" }
serde_with = { version = "3.18.0" }
hex = { version = "0.4.3" }
pnet_datalink = { version = "0.35" }
ipnetwork = { version = "0.20" }
mdns-sd = { version = "0.19.1" }

[profile.release]
lto = true
